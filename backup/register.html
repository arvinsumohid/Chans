<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="form-container">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>

            <div class="input-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" required>
            </div>

            <div class="input-group">
                <label for="middleName">Middle Name:</label>
                <input type="text" id="middleName">
                <input type="checkbox" id="noMiddleName" onchange="toggleMiddleName()"> No Middle Name
            </div>

            <div class="input-group">
                <label for="suffix">Suffix (Optional):</label>
                <select id="suffix">
                    <option value="">None</option>
                    <option value="Jr.">Jr.</option>
                    <option value="Sr.">Sr.</option>
                    <option value="II">II</option>
                    <option value="III">III</option>
                    <option value="IV">IV</option>
                    <option value="V">V</option>
                </select>
            </div>

            <div class="input-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" required>
            </div>

            <div class="input-group">
                <label for="employeeType">Employee Type:</label>
                <select id="employeeType" onchange="toggleOtherEmployeeType()">
                    <option value="">None</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Nurse">Nurse</option>
                    <option value="Administrative Staff">Administrative Staff</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="otherEmployeeType" style="display: none;" placeholder="Please specify">
                
            </div>

            <div class="input-group">
                <label for="contactNumber">Contact Number:</label>
                <input type="tel" id="contactNumber" required>
            </div>

            <div class="input-group">
                <label for="address">Address:</label>
                <input type="text" id="address" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required>
            </div>

            <div id="appointmentInfo"></div>

            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script>
        function toggleMiddleName() {
            let middleNameInput = document.getElementById("middleName");
            let noMiddleNameCheckbox = document.getElementById("noMiddleName");

            if (noMiddleNameCheckbox.checked) {
                middleNameInput.value = "";
                middleNameInput.disabled = true;
            } else {
                middleNameInput.disabled = false;
            }
        }

        function toggleEmployeeType() {
            let employeeTypeSelect = document.getElementById("employeeType");
            let otherEmployeeTypeInput = document.getElementById("otherEmployeeType");
            let noEmployeeTypeCheckbox = document.getElementById("noEmployeeType");

            if (noEmployeeTypeCheckbox.checked) {
                employeeTypeSelect.value = "";
                employeeTypeSelect.disabled = true;
                otherEmployeeTypeInput.style.display = "none";
                otherEmployeeTypeInput.value = "";
            } else {
                employeeTypeSelect.disabled = false;
                if (employeeTypeSelect.value === "Other") {
                    otherEmployeeTypeInput.style.display = "block";
                }
            }
        }

        function toggleOtherEmployeeType() {
            let employeeTypeSelect = document.getElementById("employeeType");
            let otherEmployeeTypeInput = document.getElementById("otherEmployeeType");

            if (employeeTypeSelect.value === "Other") {
                otherEmployeeTypeInput.style.display = "block";
            } else {
                otherEmployeeTypeInput.style.display = "none";
                otherEmployeeTypeInput.value = "";
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("appointment") === "true") {
                const appointmentDetails = JSON.parse(localStorage.getItem("appointmentDetails"));
                document.getElementById("appointmentInfo").innerHTML = `
                    <h3>Appointment Details:</h3>
                    <p>Date: ${appointmentDetails.date}</p>
                    <p>Time: ${appointmentDetails.time}</p>
                    <p>Service: ${appointmentDetails.service}</p>
                `;
            }
        });

        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let firstName = document.getElementById("firstName").value;
            let middleName = document.getElementById("middleName").disabled ? "None" : document.getElementById("middleName").value;
            let suffix = document.getElementById("suffix").value;
            let lastName = document.getElementById("lastName").value;
            let employeeType = document.getElementById("employeeType").value;
            if (employeeType === "Other") {
                employeeType = document.getElementById("otherEmployeeType").value;
            } else if (document.getElementById("employeeType").disabled) {
                employeeType = "None";
            }
            let contactNumber = document.getElementById("contactNumber").value;
            let address = document.getElementById("address").value;
            let email = document.getElementById("email").value;
            
            localStorage.setItem("username", username);
            localStorage.setItem("password", password);
            localStorage.setItem("firstName", firstName);
            localStorage.setItem("middleName", middleName);
            localStorage.setItem("suffix", suffix);
            localStorage.setItem("lastName", lastName);
            localStorage.setItem("employeeType", employeeType);
            localStorage.setItem("contactNumber", contactNumber);
            localStorage.setItem("address", address);
            localStorage.setItem("email", email);
            
            alert("Registration successful! You can now log in.");
            window.location.href = "login.html";  // Redirect to login page
        });
    </script>
</body>
</html>
