<!-- login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #user-login, #admin-login {
            width: 250px;
            margin: 100px auto;
            padding: 20px;
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            height: 30px;
            margin-bottom: 20px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        input[type="submit"] {
            width: 100%;
            height: 40px;
            background-color: #4CAF50;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #3e8e41;
        }
        span {
            cursor: pointer;
            text-decoration: underline;
        }
        #admin-login h2 {
            position: relative;
            padding-left: 30px;
        }
        #back-to-user-login {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="user-login">
        <h2>User Login</h2>
        <form action="dashboard.html" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <input type="submit" value="Login">
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a> | <span onclick="showAdminLogin()">Admin Login</span></p>
    </div>

    <div id="admin-login" style="display: none;">
        <h2><span id="back-to-user-login" onclick="showUserLogin()">&#8592;</span>Admin Login</h2>
        <form action="admin-dashboard.html" method="post">
            <label for="admin-username">Username:</label>
            <input type="text" id="admin-username" name="admin-username" required>
            <label for="admin-password">Password:</label>
            <input type="password" id="admin-password" name="admin-password" required>
            <input type="submit" value="Login">
        </form>
    </div>

    <script>
        function showAdminLogin() {
            document.getElementById("user-login").style.display = "none";
            document.getElementById("admin-login").style.display = "block";
        }

        function showUserLogin() {
            document.getElementById("user-login").style.display = "block";
            document.getElementById("admin-login").style.display = "none";
        }
    </script>
</body>
</html>
